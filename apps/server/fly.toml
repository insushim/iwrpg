# fly.toml — Runeword Chronicle Colyseus server
# Deploy from the REPO ROOT:  cd runeword-chronicle && fly deploy --config apps/server/fly.toml --dockerfile apps/server/Dockerfile

app = 'runeword-chronicle-server'
primary_region = 'nrt'  # Tokyo — closest to Korean classrooms; change if needed

[build]
  # Docker context is the monorepo root; Dockerfile path is provided via --dockerfile

[env]
  PORT = '8080'
  NODE_ENV = 'production'

[http_service]
  internal_port = 8080
  force_https = true
  # WebSocket connections keep the machine awake; idle stop is fine because Colyseus rooms
  # are recreated on demand. For a live class, run `fly scale count 1 --max-per-region 1`.
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '15s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
